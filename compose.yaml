      # - /tmp:exec,mode=1777,size=1G
      
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    ports:
      - 8191:8191
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.8      
    dns:
      - 1.1.1.1
      - 8.8.8.8  
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f https://www.google.com || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    labels:
      - deunhealth.restart.on.unhealthy=true
   

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.9     
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data
    ports:
      - 9443:9443

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000 
      - TZ=America/New_York
    volumes:
      - ./jellyfin/config:/config
      - /data/jellyfin/cache:/cache
      - /data/movies:/data/movies
      - /data/shows:/data/shows
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.10      
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_EPHEMERAL_SELF_UPDATE=true
    command: --cleanup --schedule "0 0 4 * * *"
    restart: unless-stopped
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.11t: unless-stopped
