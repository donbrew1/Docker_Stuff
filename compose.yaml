

services:

  openvpn:
    image: qmcgaw/gluetun:latest
    container_name: openvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./gluetun:/gluetun
    environment:
      - TZ=America/New_York
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=WNDF8IhIBZiSNd8NFsYA593nxFT7n36khE4U3ISNaWY=
      - WIREGUARD_ADDRESSES=172.16.31.131/32
      - WIREGUARD_ENDPOINT_IP=45.128.39.115
      - VPN_ENDPOINT_IP=45.128.39.115  # Adds compatibility bypass
      - WIREGUARD_ENDPOINT_PORT=51820
      - WIREGUARD_PUBLIC_KEY=658QxufMbjOTmB61Z7f+c7Rjg7oqWLnepTalqBERjF0=    
    ports:
      - 8080:8080        # qBittorrent WebUI
      - 6881:6881        # qBittorrent TCP
      - 6881:6881/udp    # qBittorrent UDP
      - 3000:3000
      - 3001:3001
    restart: always
    labels:
      - deunhealth.restart.on.unhealthy=true
    healthcheck:
      test: ["CMD-SHELL", "ping -c 1 www.google.com || exit 1"]
      interval: 20s
      timeout: 30s
      retries: 5

  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=America/New_York
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:openvpn"
    depends_on:
      openvpn:
        condition: service_started
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./qbittorrent/qBittorrent:/config
      - /data/Downloads/complete:/data/Downloads/complete
      - /data/Downloads/incomplete:/data/Downloads/incomplete
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://www.google.com || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    labels:
      - deunhealth.restart.on.unhealthy=true

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./radarr:/config
      - /data/movies:/data/movies
      - /data/Downloads/complete:/data/Downloads/complete
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./sonarr:/config
      - /data/shows:/data/shows
      - /data/Downloads/complete:/data/Downloads/complete
    ports:
      - 8989:8989
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./jackett:/config
      - /data:/data
    ports:
      - 9117:9117
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    ports:
      - 8191:8191
    restart: unless-stopped

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data
    ports:
      - 9443:9443

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./jellyfin/config:/config
      - /data/jellyfin/cache:/cache
      - /data/movies:/data/movies
      - /data/shows:/data/shows
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --schedule "0 0 4 * * *"
    restart: unless-stopped

  # speedtest:
    # image: openspeedtest/openspeedtest:latest
    # container_name: openspeedtest
    # network_mode: "service:openvpn"
    # restart: unless-stopped
