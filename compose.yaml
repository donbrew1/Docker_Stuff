
#For P2P activities, you may use the Finland, Portugal, Germany, or Spain servers.
#Finland	Helsinki	fi-p2p.jumptoserver.com  37.143.129.237
#Spain	Barcelona	es-01.jumptoserver.com  45.128.39.115
#Portugal	Lisbon	pt.jumptoserver.com  185.90.57.146
#Germany	Frankfurt	es-dbl.jumptoserver.com  45.128.39.117
#Germany	Hamburg	de-dus1.jumptoserver.com  213.202.223.32
#Germany	Dusseldorf	de-dus2.jumptoserver.com  89.163.157.125
#Germany	Frankfurt	de-01.jumptoserver.com  146.70.139.154
#Finland    Helsinki P2P1   37.143.129.152 
networks:

  servarrnetwork:
    name: servarrnetwork
    ipam:
      config:
        - subnet: 172.39.0.0/24
  
services:

  openvpn:
    image: qmcgaw/gluetun:latest
    container_name: openvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./gluetun:/gluetun
    environment:
      - TZ=America/New_York
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=WNDF8IhIBZiSNd8NFsYA593nxFT7n36khE4U3ISNaWY=
      - WIREGUARD_ADDRESSES=172.16.31.131/32
      - WIREGUARD_ENDPOINT_IP=185.90.57.146
      - VPN_ENDPOINT_IP=185.90.57.146  # Adds compatibility bypass
      - WIREGUARD_ENDPOINT_PORT=51820
      - WIREGUARD_PUBLIC_KEY=658QxufMbjOTmB61Z7f+c7Rjg7oqWLnepTalqBERjF0= 
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.2      
    ports:
      - 8080:8080        # qBittorrent WebUI
      - 6881:6881        # qBittorrent TCP
      - 6881:6881/udp    # qBittorrent UDP
      - 3000:3000
      - 3001:3001
    restart: always
    labels:
      - deunhealth.restart.on.unhealthy=true
    healthcheck:
      test: ["CMD-SHELL", "ping -c 1 www.google.com || exit 1"]
      interval: 20s
      timeout: 30s
      retries: 5

  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=America/New_York
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:openvpn"
    depends_on:
      openvpn:
        condition: service_started
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=0000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - /etc/localtime:/etc/localtime:ro
      #- ./qbittorrent:/config
      - ./qbittorrent/qBittorrent:/config
      #- ./qbittorrent/qBittorrent/qBittorrent:/config
      - /data/Downloads:/data/Downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://www.google.com || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    labels:
      - deunhealth.restart.on.unhealthy=true

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./prowlarr:/config
    ports:
      - 9696:9696
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.5      
    dns:
      - 1.1.1.1
      - 8.8.8.8 
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://www.google.com || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    labels:
      - deunhealth.restart.on.unhealthy=true
    

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./radarr:/config
      - /data:/data
      - /data/backup/radarr
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.6      
    ports:
      - 7878:7878
    dns:
      - 1.1.1.1
      - 8.8.8.8 
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://www.google.com || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    labels:
      - deunhealth.restart.on.unhealthy=true
    restart: unless-stopped
    

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./sonarr:/config
      - /data:/data
      - /data/backup/sonarr
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.4     
    ports:
      - 8989:8989
    dns:
      - 1.1.1.1
      - 8.8.8.8 
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://www.google.com || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    labels:
      - deunhealth.restart.on.unhealthy=true
    

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./jackett:/config
      - /data:/data
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.7      
    ports:
      - 9117:9117
    dns:
      - 1.1.1.1
      - 8.8.8.8 
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://www.google.com || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    labels:
      - deunhealth.restart.on.unhealthy=true
      
  # byparr:
    # image: ghcr.io/thephaseless/byparr:latest
    # container_name: byparr
    # restart: unless-stopped
    # ports:
      # - "8191:8191"
    # environment:
      # - LOG_LEVEL=INFO
