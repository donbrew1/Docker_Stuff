

services:
  openvpn:
    image: dperson/openvpn-client:latest
    container_name: openvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./openvpn:/vpn
    environment:
      - TZ=America/New_York
    command: "-f '' -r 0.0.0.0/0"
    ports:
      - 8080:8080        # qBittorrent WebUI (LAN)
      - 6881:6881        # qBittorrent TCP
      - 6881:6881/udp    # qBittorrent UDP
    restart: always
    labels:
      - deunhealth.restart.on.unhealthy=true  
    
  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=${TZ}
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:openvpn"
    depends_on:
      - openvpn
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./qbittorrent:/config
      - /data/Downloads/complete:/data/Downloads/complete
      - /data/Downloads/incomplete:/data/Downloads/incomplete
    restart: always
    labels:
      - deunhealth.restart.on.unhealthy=true     

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./radarr:/config
      - /data/movies:/data/movies
      - /data/Downloads/complete:/data/Downloads/complete
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./sonarr:/config
      - /data/shows:/data/shows
      - /data/Downloads/complete:/data/Downloads/complete
    ports:
      - 8989:8989
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./jackett:/config
      - /data:/data
    ports:
      - 9117:9117
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    ports:
      - 8191:8191
    restart: unless-stopped

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data
    ports:
      - 9443:9443
     # - 8000:8000  # Remove if you do not intend to use Edge Agents
 jellyfin:
   image: jellyfin/jellyfin:latest
   container_name: jellyfin
   environment:
     - PUID=1000 # Replace with your user ID
     - PGID=1000 # Replace with your group ID
     - TZ=America/New_York # Replace with your timezone
   volumes:
     - ./jellyfin/config:/config # Host path for Jellyfin configuration
     - /data/jellyfin/cache:/cache # Host path for Jellyfin cache
     - /data/movies:/data/movies # Host path for movies, read-only
     - /data/shows:/data/shows # Host path for TV shows, read-only
     # Add more media library mappings as needed
   ports:
     - 8096:8096 # Web interface
     - 8920:8920 # HTTPS (optional)
     - 7359:7359/udp # DLNA discovery (optional)
     - 1900:1900/udp # DLNA advertisement (optional)
  restart: always 
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --schedule "0 0 4 * * *"
    restart: unless-stopped
